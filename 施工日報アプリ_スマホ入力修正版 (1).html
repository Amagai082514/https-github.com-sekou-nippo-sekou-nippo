<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>施工日報アプリ</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fa;color:#172333}header{background:#17324d;color:#fff;padding:16px}main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce4ec;border-radius:14px;padding:14px;margin-bottom:14px}h1{font-size:21px;margin:0}h2{font-size:18px;margin:0 0 12px}.field{margin:12px 0}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}input,select,textarea,button{font:inherit}input,select,textarea{display:block;width:100%;min-width:0;min-height:48px;padding:12px;border:1px solid #aebdce;border-radius:10px;background:#fff;color:#111;font-size:16px;appearance:auto;-webkit-appearance:auto;touch-action:manipulation}textarea{min-height:90px}button{min-height:46px;padding:10px 14px;border:1px solid #b9c6d4;border-radius:10px;background:#fff;color:#172333;touch-action:manipulation}.primary{background:#1769aa;color:#fff;border-color:#1769aa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qty{display:grid;grid-template-columns:1fr 1fr;gap:9px;border:1px solid #dce4ec;border-radius:10px;padding:12px;margin:10px 0}.qty .wide{grid-column:1/-1}.sum{background:#eef6fc;padding:12px;border-radius:9px}.photos{display:flex;flex-wrap:wrap;gap:8px}.photo{width:125px}.photo img{width:125px;height:95px;object-fit:cover;border-radius:8px}.muted{color:#637386;font-size:13px}.totals{display:flex;gap:10px}.totals>div{flex:1;background:#eef6fc;padding:12px;border-radius:10px}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1 1 130px}@media(max-width:600px){main{padding:8px}.grid{grid-template-columns:1fr}.qty{grid-template-columns:1fr 1fr}.totals{flex-direction:column}}@media print{header,.no-print{display:none!important}body{background:white}}
</style></head><body><header><h1>内装施工日報</h1>スマホ入力修正版</header><main>
<section class="card"><h2>日報入力</h2>
<div class="grid">
<div class="field"><label for="date">施工日</label><input id="date" type="date"></div>
<div class="field"><label for="site">現場</label><select id="site"><option value="">現場を選択</option></select><button type="button" id="addSite">＋現場を追加</button></div>
<div class="field"><label for="leader">作業リーダー名</label><input id="leader" type="text" placeholder="リーダー名"></div>
<div class="field"><label>作業者</label><div id="workers"></div><button type="button" id="addWorker">＋作業者欄</button> <button type="button" id="registerWorker">＋作業者を登録</button></div>
<div class="field"><label for="work">施工内容</label><select id="work"><option value="">選択してください</option><option>LGS壁</option><option>LGS天井</option><option>ボード壁</option><option>ボード天井</option><option>システム天井</option><option>諸口工事LGS</option><option>諸口工事ボード</option><option>システム天井諸口</option><option>その他</option></select></div>
<div class="field" id="otherWrap" hidden><label for="other">その他の施工内容</label><input id="other"></div>
</div>
<h2>施工数量 <button type="button" class="primary" id="addQty">＋数量欄</button></h2><p class="muted">各行で合計単位を㎡またはmから選択。㎡は縦×横、mは縦の数値を合計します。</p><div id="qtyRows"></div>
<div class="totals"><div>㎡合計<strong id="sqm">0.00 ㎡</strong></div><div>m合計<strong id="metres">0.00 m</strong></div></div>
<div class="field"><label for="photoInput">現場写真（複数選択可）</label><input id="photoInput" type="file" accept="image/*" capture="environment" multiple><div id="photoPreview" class="photos"></div></div>
<div class="field"><label for="notes">作業内容・備考</label><textarea id="notes" placeholder="作業内容、申し送り事項"></textarea></div>
<div class="actions no-print"><button type="button" class="primary" id="save">日報を保存</button><button type="button" id="clear">入力クリア</button><button type="button" id="csv">CSV出力</button><button type="button" id="pdf">印刷／PDF保存</button></div><p id="status" class="muted" role="status"></p><p class="muted">保存先はこのブラウザです。同じ端末・同じブラウザでご利用ください。端末間共有にはクラウド化が必要です。</p>
</section><section class="card"><h2>日報履歴</h2><label for="search">検索</label><input id="search" placeholder="日付・現場・リーダー・作業者"><div id="history"></div></section></main>
<script>
(function(){
const $=id=>document.getElementById(id);const KEY='site_daily_report_mobile_fix';let data={sites:[],workers:[],reports:[]};try{data=Object.assign(data,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let qty=[],photos=[],selected=[];
const today=new Date();$('date').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderSites(){const old=$('site').value;$('site').innerHTML='<option value="">現場を選択</option>'+data.sites.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(data.sites.includes(old))$('site').value=old}
$('addSite').addEventListener('click',()=>{const n=prompt('現場名を入力');if(n&&n.trim()){const v=n.trim();if(!data.sites.includes(v))data.sites.push(v);saveData();renderSites();$('site').value=v}});
function renderWorkers(){$('workers').innerHTML=selected.map((v,i)=>`<div style="display:flex;gap:6px;margin:7px 0"><select aria-label="作業者${i+1}" data-worker="${i}"><option value="">作業者を選択</option>${data.workers.map(n=>`<option value="${esc(n)}" ${n===v?'selected':''}>${esc(n)}</option>`).join('')}</select><button type="button" data-worker-del="${i}">削除</button></div>`).join('')}
$('addWorker').addEventListener('click',()=>{selected.push('');renderWorkers()});
$('registerWorker').addEventListener('click',()=>{const n=prompt('登録する作業者名');if(n&&n.trim()){const v=n.trim();if(!data.workers.includes(v))data.workers.push(v);selected.push(v);saveData();renderWorkers()}});
$('workers').addEventListener('change',e=>{if(e.target.dataset.worker!==undefined)selected[+e.target.dataset.worker]=e.target.value});
$('workers').addEventListener('click',e=>{if(e.target.dataset.workerDel!==undefined){selected.splice(+e.target.dataset.workerDel,1);renderWorkers()}});
function area(q){return q.unit==='m'?(+q.h||0):(+q.h||0)*(+q.w||0)}
function totals(){let a=0,m=0;qty.forEach(q=>q.unit==='m'?m+=area(q):a+=area(q));$('sqm').textContent=a.toFixed(2)+' ㎡';$('metres').textContent=m.toFixed(2)+' m'}
function renderQty(){$('qtyRows').innerHTML=qty.map((q,i)=>`<div class="qty"><label class="wide">項目名<select data-q="${i}" data-k="name"><option value="">項目を選択</option>${['LGS壁','LGS天井','ボード壁','ボード天井','システム天井','諸口工事LGS','諸口工事ボード','システム天井諸口'].map(n=>`<option value="${n}" ${q.name===n?'selected':''}>${n}</option>`).join('')}</select></label><label>縦（m）<input inputmode="decimal" type="number" min="0" step="any" data-q="${i}" data-k="h" value="${esc(q.h||'')}"></label><label>横（m）<input inputmode="decimal" type="number" min="0" step="any" data-q="${i}" data-k="w" value="${esc(q.w||'')}" ${q.unit==='m'?'disabled':''}></label><label>合計単位<select data-q="${i}" data-k="unit"><option value="㎡" ${q.unit!=='m'?'selected':''}>㎡</option><option value="m" ${q.unit==='m'?'selected':''}>m</option></select></label><div class="sum"><small>1行合計</small><strong>${area(q).toFixed(2)} ${q.unit==='m'?'m':'㎡'}</strong></div><button type="button" data-qdel="${i}">この行を削除</button></div>`).join('');totals()}
$('addQty').addEventListener('click',()=>{qty.push({name:'',h:'',w:'',unit:'㎡'});renderQty()});
$('qtyRows').addEventListener('input',e=>{const i=e.target.dataset.q,k=e.target.dataset.k;if(i===undefined)return;qty[+i][k]=e.target.value;const row=e.target.closest('.qty');row.querySelector('.sum strong').textContent=area(qty[+i]).toFixed(2)+' '+(qty[+i].unit==='m'?'m':'㎡');totals()});
$('qtyRows').addEventListener('change',e=>{const i=e.target.dataset.q,k=e.target.dataset.k;if(i!==undefined){qty[+i][k]=e.target.value;renderQty()}});
$('qtyRows').addEventListener('click',e=>{if(e.target.dataset.qdel!==undefined){qty.splice(+e.target.dataset.qdel,1);renderQty()}});
$('work').addEventListener('change',()=>$('otherWrap').hidden=$('work').value!=='その他');
$('photoInput').addEventListener('change',async e=>{for(const f of Array.from(e.target.files||[])){if(!f.type.startsWith('image/'))continue;const src=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)});photos.push({name:f.name,data:src})}renderPhotos();e.target.value=''});
function renderPhotos(){$('photoPreview').innerHTML=photos.map((p,i)=>`<div class="photo"><img src="${p.data}" alt="${esc(p.name)}"><div class="muted">${esc(p.name)}</div><button type="button" data-pdel="${i}">写真を削除</button></div>`).join('')}
$('photoPreview').addEventListener('click',e=>{if(e.target.dataset.pdel!==undefined){photos.splice(+e.target.dataset.pdel,1);renderPhotos()}});
function build(){return {id:Date.now(),date:$('date').value,site:$('site').value,leader:$('leader').value,workers:selected.filter(Boolean),work:$('work').value==='その他'?$('other').value:$('work').value,qty:qty.map(q=>({...q})),sqm:qty.filter(q=>q.unit!=='m').reduce((s,q)=>s+area(q),0),metres:qty.filter(q=>q.unit==='m').reduce((s,q)=>s+area(q),0),photos:photos.map(p=>({...p})),notes:$('notes').value}}
$('save').addEventListener('click',()=>{if(!$('site').value||!$('work').value){alert('現場と施工内容を選択してください');return}data.reports.unshift(build());if(saveData()){$('status').textContent='日報を保存しました';renderHistory()}else{data.reports.shift();alert('保存容量を超えました。写真の枚数やサイズを減らしてください。')}});
function renderHistory(){const term=$('search').value.toLowerCase();const list=data.reports.filter(r=>[r.date,r.site,r.leader,(r.workers||[]).join(' '),r.work].join(' ').toLowerCase().includes(term));$('history').innerHTML=list.map(r=>`<article class="entry"><b>${esc(r.date)}｜${esc(r.site)}</b><p>${esc(r.work)}<br>リーダー：${esc(r.leader||'未入力')}<br>作業者：${esc((r.workers||[]).join('、'))}</p><p>合計：${(+r.sqm||0).toFixed(2)}㎡ ／ ${(+r.metres||0).toFixed(2)}m</p><p>${esc(r.notes||'')}</p><div class="photos">${(r.photos||[]).map(p=>`<img src="${p.data}" alt="" style="width:90px;height:70px;object-fit:cover">`).join('')}</div><button type="button" data-rdel="${r.id}">日報を削除</button></article>`).join('')||'<p class="muted">日報はありません</p>'}
$('history').addEventListener('click',e=>{if(e.target.dataset.rdel&&confirm('この日報を削除しますか？')){data.reports=data.reports.filter(r=>r.id!==+e.target.dataset.rdel);saveData();renderHistory()}});
$('search').addEventListener('input',renderHistory);
$('clear').addEventListener('click',()=>{if(confirm('入力をクリアしますか？')){['leader','notes','other'].forEach(k=>$(k).value='');$('site').value='';$('work').value='';$('otherWrap').hidden=true;selected=[];qty=[];photos=[];renderWorkers();renderQty();renderPhotos();$('status').textContent='入力欄をクリアしました'}});
$('csv').addEventListener('click',()=>{const rows=[['日付','現場','リーダー','作業者','施工内容','㎡合計','m合計','備考'],...data.reports.map(r=>[r.date,r.site,r.leader,(r.workers||[]).join('、'),r.work,r.sqm,r.metres,r.notes])];const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='施工日報.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$('pdf').addEventListener('click',()=>window.print());
renderSites();renderWorkers();qty=[{name:'LGS壁',unit:'㎡',h:'',w:''},{name:'ボード壁',unit:'㎡',h:'',w:''}];renderQty();renderHistory();
})();
</script></body></html>
